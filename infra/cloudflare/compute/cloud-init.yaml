#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - rsync
runcmd:
  - [install, -d, -m, "0755", /etc/apt/keyrings]
  - [curl, -fsSL, https://download.docker.com/linux/ubuntu/gpg, -o, /etc/apt/keyrings/docker.asc]
  - [chmod, a+r, /etc/apt/keyrings/docker.asc]
  - [sh, -c, "printf '%s\n' 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' > /etc/apt/sources.list.d/docker.list"]
  - [apt-get, update]
  - [apt-get, install, -y, docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
  - [systemctl, enable, --now, docker]
  - [install, -d, -m, "0700", /opt/rakazo]
ssh_pwauth: false
disable_root: false
